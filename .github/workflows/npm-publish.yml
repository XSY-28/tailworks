# npm publish: when a maintainer publishes a GitHub release (the draft that
# release.yml built), publish @twd/tailnet, @twd/node, @twd/mcp and
# create-twd at the same version, from the same tag (ADR-041 §9: npm
# follows the GitHub release). scripts/npm-publish.sh checks that every
# package and template is at the tag's version first, and skips packages
# already published, so re-running it (or running it by hand for an
# existing tag) is safe.
#
# Needs the repository secret NPM_TOKEN (an npm automation or granular
# token that may publish the @twd scope and create-twd). Without it the job
# says so and does nothing, so forks and repos without npm access don't
# fail. release.yml's gates already ran a --dry-run of the same script.
#
# By hand for an existing tag: gh workflow run npm-publish.yml -f tag=v0.3.0
name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish to npm, e.g. v0.3.0"
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

env:
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for NPM_TOKEN
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set: not publishing $TAG to npm"
            echo "skip=1" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != '1'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.skip != '1'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches VERSION
        if: steps.token.outputs.skip != '1'
        run: |
          v="${TAG#v}"
          if [ "$v" != "$(cat VERSION)" ]; then
            echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1
          fi
      - name: npm ci
        if: steps.token.outputs.skip != '1'
        run: npm ci
      - name: Publish
        if: steps.token.outputs.skip != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: sh scripts/npm-publish.sh "$TAG"
