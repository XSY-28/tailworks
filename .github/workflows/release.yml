# Release: on a v* tag (or by hand for an existing tag), build every part
# of the three tarballs and attach them, with SHA256SUMS, to a DRAFT GitHub
# release. A maintainer reviews the draft and publishes it; scripts/get.sh
# installs the latest published release.
#
#   vm-assets (amd64, arm64)  Linux runners, native arch: `make vm-assets`,
#                             the Firecracker guest for linux-<arch>: rootfs,
#                             kernel, firecracker + jailer (pinned, checked).
#   vz-assets                 arm64 Linux: `make vz-assets`, the macOS
#                             (Virtualization.framework) guest kernel + image.
#   gates                     Linux: scripts/release-check.sh (tag = VERSION,
#                             notes finalized, a signing key pinned), `make
#                             lint test`, a dry run of the npm
#                             publish (scripts/npm-publish.sh; the packages
#                             and templates at the tag's version), the
#                             install.sh rollback
#                             test, and `make e2e-upgrade` (upgrade from the
#                             newest published release to this tag: data,
#                             rejoin, old bundles; ADR-041 §9; from this tree
#                             while none is published: scripts/upgrade-from.sh).
#                             No draft
#                             unless every gate passes.
#   release                   macOS (the darwin binaries are ad-hoc signed,
#                             tw-vz with the virtualization entitlement):
#                             `make release` with the three asset dirs, and
#                             RELEASE_VM_ASSETS=1, so a tarball without its
#                             microVM guest fails the build instead of
#                             shipping without the tier. Every SHA256SUMS
#                             is signed (SHA256SUMS.sig; docs/RELEASING.md,
#                             "Signing").
#
# The guest builds need no root and no VM (mkfs.ext4 -d, debugfs; plain gcc
# kernel builds), and are meant to be reproducible: Ubuntu 24.04's gcc 13.3
# is the same compiler as Lima tw-dev's, so CI and a local `make release`
# should produce the same vmlinux and rootfs hashes (manifest.json,
# kernel.json). Kernels are cached by their inputs.
#
# Run it by hand for an existing tag: gh workflow run release.yml -f tag=v0.1.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v0.1.0"
        required: true

# Read-only by default; only the release job (which drafts the release and
# uploads the tarballs) gets contents: write.
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags and history: check-changes and the upgrade test's previous release
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # First, and cheap: the tag matches VERSION and the npm versions, its
      # notes are finalized with nothing pending, and a signing key is pinned.
      - name: Ready to release (scripts/release-check.sh)
        run: sh scripts/release-check.sh "$TAG"
      - name: make lint test
        run: make lint test
      - name: npm packages at the tag's version (dry run; npm-publish.yml publishes)
        run: sh scripts/npm-publish.sh "${TAG#v}" --dry-run
      - name: install.sh upgrade and rollback
        run: make install-test
      - name: make e2e-upgrade (newest published release → this tag)
        run: make e2e-upgrade

  # The Headscale profile against every supported Headscale minor, in Docker
  # (ADR-041 §9 gate 6). One minor until Headscale v0.30
  # (docs/headscale.md); then add the newest two, one line each.
  headscale:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        image:
          - headscale/headscale:v0.29.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: make e2e-headscale (${{ matrix.image }})
        run: make e2e-headscale HEADSCALE_IMAGE=${{ matrix.image }}

  vm-assets:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison bc libelf-dev libssl-dev e2fsprogs binutils openssl curl
      - name: Cache the guest kernel (by its inputs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guest/out/kernel-${{ matrix.arch }}
          key: guest-kernel-${{ matrix.arch }}-${{ hashFiles('guest/inputs.sh', 'guest/build-kernel.sh', 'guest/kernel/tw.config') }}
      - name: Cache guest downloads (content-checked)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/cache/guest
          key: guest-downloads-${{ matrix.arch }}-${{ hashFiles('guest/inputs.sh', 'package-lock.json') }}
      - name: make vm-assets
        run: |
          make deps
          TW_VERSION="${TAG#v}" make vm-assets GUEST_ARCH=${{ matrix.arch }} VM_ASSETS=dist/vm-assets-${{ matrix.arch }}
          cat dist/vm-assets-${{ matrix.arch }}/manifest.json
          sha256sum dist/vm-assets-${{ matrix.arch }}/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-assets-${{ matrix.arch }}
          path: dist/vm-assets-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  vz-assets:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison bc libelf-dev libssl-dev e2fsprogs binutils openssl curl
      - name: Cache the vz guest (the script rebuilds only if its inputs changed)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/vz-assets-arm64
          key: vz-assets-${{ hashFiles('guest/**', 'go.mod', 'go.sum', 'package-lock.json') }}
      - name: make vz-assets
        run: |
          TW_VERSION="${TAG#v}" make vz-assets VZ_ASSETS=dist/vz-assets-arm64
          sha256sum dist/vz-assets-arm64/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vz-assets-arm64
          path: dist/vz-assets-arm64
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [vm-assets, vz-assets, gates, headscale]
    runs-on: macos-15
    # The signing key is this environment's secret: only this job sees it.
    environment: release
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the previous tag, for the release notes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check the tag matches VERSION
        run: |
          v="${TAG#v}"
          if [ "$v" != "$(cat VERSION)" ]; then
            echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-assets-amd64
          path: dist/vm-assets-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-assets-arm64
          path: dist/vm-assets-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vz-assets-arm64
          path: dist/vz-assets-arm64
      # Signed (issue #71): every SHA256SUMS (each tarball's, and the
      # release's) gets SHA256SUMS.sig, an SSH signature by the key in the
      # release environment's TW_RELEASE_SIGNING_KEY secret, which must be
      # pinned in internal/releasesig/allowed_signers (release.sh checks).
      # No secret, no release. Key ceremony: docs/RELEASING.md, "Signing".
      - name: make release (every tarball with its microVM guest, signed)
        env:
          SIGNING_KEY: ${{ secrets.TW_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::no TW_RELEASE_SIGNING_KEY secret (docs/RELEASING.md, Signing)"; exit 1; }
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" >"$key")
          chmod +x dist/vm-assets-*/firecracker dist/vm-assets-*/jailer
          export TW_VM_ASSETS_amd64="$PWD/dist/vm-assets-amd64"
          export TW_VM_ASSETS_arm64="$PWD/dist/vm-assets-arm64"
          export TW_VZ_ASSETS="$PWD/dist/vz-assets-arm64"
          TW_RELEASE_SIGNING_KEY="$key" TW_RELEASE_SIGN=1 make release RELEASE_VERSION="${TAG#v}" RELEASE_VM_ASSETS=1
          cat dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Smoke test the darwin tarball
        run: |
          mkdir -p "$RUNNER_TEMP/t" && tar -xzf dist/tailworks-*-darwin-arm64.tar.gz -C "$RUNNER_TEMP/t"
          "$RUNNER_TEMP"/t/tailworks-*/bin/tw version
          for a in darwin-arm64 linux-arm64 linux-amd64; do
            tar -xzOf dist/tailworks-*-$a.tar.gz '*/share/tailworks/release.json' | grep -Eq '"microvm": ?true' ||
              { echo "$a: release.json has no microVM tier"; exit 1; }
          done
          # Signed, as get.sh and install.sh check it (the pinned keys only).
          ssh-keygen -Y verify -f internal/releasesig/allowed_signers -I tw-release -n tw-release -s dist/SHA256SUMS.sig <dist/SHA256SUMS
          t=$(ls -d "$RUNNER_TEMP"/t/tailworks-*)
          ssh-keygen -Y verify -f internal/releasesig/allowed_signers -I tw-release -n tw-release -s "$t/SHA256SUMS.sig" <"$t/SHA256SUMS"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || echo -)
          scripts/release-notes.sh "$prev" "$TAG" >"$RUNNER_TEMP/notes.md"
          printf '\nInstall: see docs/INSTALL.md (or scripts/get.sh). Upgrade: `tw upgrade %s`. Built by .github/workflows/release.yml.\n' "$TAG" >>"$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "tw $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/tailworks-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
